name: Build & Release BTTUNE APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --build-cache --parallel --no-daemon

      - name: Prepare Single Clean Release APK
        id: version_step
        run: |
          mkdir -p release-output
          
          # Pick lightweight APK (arm64-v8a preferred for small size ~8-9MB, or single release)
          if ls app/build/outputs/apk/release/*arm64-v8a*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*arm64-v8a*.apk release-output/BTTUNE-release.apk
          elif ls app/build/outputs/apk/release/*universal*.apk 1> /dev/null 2>&1; then
            cp app/build/outputs/apk/release/*universal*.apk release-output/BTTUNE-release.apk
          else
            cp app/build/outputs/apk/release/*.apk release-output/BTTUNE-release.apk
          fi
          
          ls -lh release-output/
          
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          echo "VERSION_TAG=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Upload BTTUNE APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: BTTUNE-release-apk
          path: release-output/BTTUNE-release.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.version_step.outputs.VERSION_TAG }}
          name: "BTTUNE ${{ steps.version_step.outputs.VERSION_NAME }}"
          body: |
            ### 🎵 BTTUNE - Modern Music Streaming
            
            - **Ultra-lightweight APK**: ~8.2 MB (`BTTUNE-release.apk`)
            - **Clean UI & Liquid Experience**: Edge-to-edge UI with smart medium caching
            - **Seamless in-app direct updates**
          draft: false
          prerelease: false
          files: release-output/BTTUNE-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

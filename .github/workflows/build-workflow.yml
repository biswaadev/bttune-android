name: Build Workflow (Release, Nightly, Debug)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-variants:
    name: Build ${{ matrix.title }} APK
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: release
            task: assembleRelease
            artifact: AirBeats-Release-APK
            output_dir: release
            title: Release
          - variant: nightly
            task: assembleNightly
            artifact: AirBeats-Nightly-APK
            output_dir: nightly
            title: Nightly
          - variant: debug
            task: assembleDebug
            artifact: AirBeats-Debug-APK
            output_dir: debug
            title: Debug

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Remove local Java path from gradle.properties
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Google Services JSON and Keystore
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON}" ]; then
            echo "${GOOGLE_SERVICES_JSON}" | base64 --decode > app/google-services.json
          else
            cat <<EOF > app/google-services.json
          {
            "project_info": { "project_number": "1234567890", "project_id": "dummy-project" },
            "client": [ 
              { "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef123456", "android_client_info": { "package_name": "com.darkxvenom.airbeats" } }, "api_key": [ { "current_key": "dummy-key" } ] },
              { "client_info": { "mobilesdk_app_id": "1:1234567890:android:abcdef123456", "android_client_info": { "package_name": "com.darkxvenom.airbeats.debug" } }, "api_key": [ { "current_key": "dummy-key" } ] }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          if [ -n "${SIGNING_KEY_BASE64}" ]; then
            echo "${SIGNING_KEY_BASE64}" | base64 --decode > app/keystore.jks
          fi

      - name: Build ${{ matrix.title }} APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          SIGNING_PARAMS=""
          if [ -f "app/keystore.jks" ] && [ -n "${KEYSTORE_PASSWORD}" ]; then
            SIGNING_PARAMS="-Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/app/keystore.jks -Pandroid.injected.signing.store.password=${KEYSTORE_PASSWORD} -Pandroid.injected.signing.key.alias=${KEY_ALIAS} -Pandroid.injected.signing.key.password=${KEY_PASSWORD}"
          fi
          ./gradlew ${{ matrix.task }} $SIGNING_PARAMS

      - name: Prepare ${{ matrix.title }} APK
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "4.3.0")
          APK_FILE=$(find app/build/outputs/apk/${{ matrix.output_dir }} -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in app/build/outputs/apk/${{ matrix.output_dir }}"
            exit 1
          fi
          TARGET_NAME="AirBeats-v${VERSION_NAME}-${{ matrix.title }}.apk"
          cp "$APK_FILE" "$TARGET_NAME"
          echo "TARGET_NAME=$TARGET_NAME" >> $GITHUB_ENV

      - name: Upload ${{ matrix.title }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.TARGET_NAME }}
          if-no-files-found: error

  fetch-desktop-builds:
    name: Fetch Desktop Builds (Windows, macOS, Linux)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    steps:
      - name: Download Latest Desktop Releases from Airbeats-Desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p desktop-builds
          gh release download --repo d0x-dev/Airbeats-Desktop --dir desktop-builds --pattern "*" || true
          ls -la desktop-builds

      - name: Upload Windows (.exe) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Windows-EXE
          path: |
            desktop-builds/*setup.exe
            desktop-builds/*portable.exe
          if-no-files-found: warn

      - name: Upload macOS (.dmg) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-macOS-DMG
          path: desktop-builds/*.dmg
          if-no-files-found: warn

      - name: Upload Linux (Snap & AppImage) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBeats-Linux-Snap-AppImage
          path: |
            desktop-builds/*.AppImage
            desktop-builds/*.deb
            desktop-builds/*.snap
          if-no-files-found: warn

  notify-telegram:
    name: Send Build Links to Telegram (Topic 812)
    needs: [build-variants, fetch-desktop-builds]
    runs-on: ubuntu-latest
    if: always() && needs.build-variants.result == 'success'
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Post Download Buttons to Telegram Topic 812
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: "-1004388752678"
          THREAD_ID: "812"
          RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.release.name || github.event.head_commit.message || 'Official Release' }}
        run: python3 .github/scripts/notify_all_builds.py
